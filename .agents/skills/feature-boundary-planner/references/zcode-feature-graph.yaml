  - id: surface.files-editor-workbench
    kind: ui-surface
    label: Files primary-view editor workbench
    aliases:
      - Monaco editor tabs
      - 文件编辑器
      - 文件菜单
      - 另存为
      - 使用系统对话框
    codeSeeds:
      - file: packages/ui/src/files-workbench/FilesWorkbenchSurface.tsx
        symbol: FilesWorkbenchSurface
      - file: packages/ui/src/files-workbench/FilesSaveAsDialog.tsx
        symbol: FilesSaveAsDialog
      - file: packages/ui/src/files-workbench/FilesWorkbenchSaveAsDialog.tsx
        symbol: FilesWorkbenchSaveAsDialog
      - file: packages/ui/src/files-workbench/FilesWorkbenchMenuBar.tsx
        symbol: FilesWorkbenchMenuBar
      - file: packages/ui/src/files-workbench/useFilesWorkbenchTabChrome.ts
        symbol: useFilesWorkbenchTabChrome
      - file: packages/ui/src/PreviewPane.tsx
        symbol: PreviewPane
    invariants:
      - Desktop uses its native application menu (macOS system menu or Windows/Linux menu button);
        Web exposes a File / Edit toolbar. Commands reuse the same workbench owner and editor target.
      - Native Save As chooses a path only for the current Desktop local workspace; remote identities
        and sessions keep the built-in browser. Confirmation reuses the same save owner, and cancelled
        or stale native results never write files or stop the pending save queue.
      - Desktop tabs start at the workbench top without a dedicated caption or drag row.
        Window drag stays in the global left chrome; Windows/Linux controls occupy only the
        upper-right corner. Actual rectangle collisions project insets only to intersecting tabs;
        a narrow covered group moves its own tabs below controls without moving other groups.
      - Hidden surfaces disable native window drag on the entire descendant tree through the
        window-drag-disabled boundary. Opacity, inert, pointer-events, and a no-drag root alone
        do not suppress explicit drag regions declared by keepalive headers or side panes.
        The boundary restores the initial none mode so hidden nodes export neither drag nor
        subtractive no-drag rectangles, preserving other visible surfaces' drag areas.
  - id: state.files-editor-buffers
    kind: state-owner
    label: Files editor buffers and open tabs
    invariants:
      - Buffer identity is workspace key plus path; untitled buffers have their own id until save.
      - Dirty close confirms save / discard / cancel. External disk conflicts are detected only
        on save, not as live reload.
      - A workbench group has at most one preview tab; single-click replaces it, double-click or
        edit pins it. Semantic TypeScript validation is off in this editor.
      - Successful rename and move migrate all affected paths without clearing dirty text. Deleted
        dirty files become untitled drafts; stale reads cannot reintroduce removed paths.
  - id: surface.workspace-shell-primary-tabs
    kind: ui-surface
    label: Workspace shell primary tab bar
    aliases:
      - 底栏主视图
      - tasks files bots settings
      - Bot 主视图入口
    codeSeeds:
      - file: packages/ui/src/app-shell/WorkspaceShellPrimaryTabBar.tsx
        symbol: WorkspaceShellPrimaryTabBar
      - file: packages/ui/src/store/tabStore.ts
        symbol: SETTINGS_TAB_ID
      - file: packages/ui/src/store/tabStore.ts
        symbol: BOTS_TAB_ID
  - id: capability.bot-task-watch
    kind: capability
    label: Bot task subscribe, answer, and execute plan
    aliases:
      - bot_task subscribe
      - 订阅结束
      - 等拍板
      - 代答问
      - 代执行计划
    codeSeeds:
      - file: apps/zcode-cli/packages/contracts/src/interfaces/bot-task.port.ts
        symbol: BotTaskPort
      - file: apps/zcode-cli/packages/bootstrap/src/zcode-protocol/bot-task-port.ts
        symbol: createBotTaskPort
      - file: apps/zcode-cli/packages/core/src/tool/handlers/bot-task.ts
        symbol: botTaskToolEntry
    invariants:
      - Subscribe returns immediately and does not occupy the Bot Worker slot.
      - Watched events are task end and waiting-for-user only; permission prompts never fire.
      - Clicking the resulting system notification opens that Bot, not the task.
  - id: service.bot-task-watch-host
    kind: service
    label: Protocol-server bot_task watches
    codeSeeds:
      - file: apps/zcode-cli/packages/bootstrap/src/zcode-protocol/bot-task-port.ts
        symbol: dispatchBotTaskWatches
