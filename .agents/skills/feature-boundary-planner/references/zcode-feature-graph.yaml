    rank: conditional
    condition:
      Only file candidates use bounded Host file search; other mention providers keep their own
      option sources.
  - from: service.composer-host-file-search
    to: boundary.workspace-key
    type: isolated-by
    rank: must-inspect
  - from: capability.composer-trigger-routing
    to: capability.conversation-runtime
    type: preserves-canonical-input-for
    rank: invariant-only
    condition:
      Changing candidate discovery or grouping must preserve the selected item representation
      submitted to the conversation.
  - from: surface.conversation-model-control
    to: state.composer-submission-intent
    type: edits-draft
    rank: must-inspect
    condition:
      The menu updates the next submission intent even for an existing conversation; it does
      not immediately switch the running model.
  - from: state.composer-submission-intent
    to: service.conversation-submission
    type: submits-selection-to
    rank: must-inspect
    condition: Sending captures modelSelection in the submission; subsequent menu edits affect later sends.
  - from: service.conversation-submission
    to: service.conversation-command-inbox
    type: requires-admission-through
    rank: must-inspect
    condition: V4 commands pass through CommandInbox before the gateway dispatches their handlers.
  - from: service.conversation-submission
    to: service.runtime-submission-execution
    type: schedules-selection-for
    rank: must-inspect
    condition:
      CLI applies admitted configuration when execution starts, or when a Guide reaches the next
      model step.
  - from: service.runtime-submission-execution
    to: state.conversation-product-projection
    type: emits-model-selection-for
    rank: must-inspect
    condition: Applied runtime model selection is projected through ModelSelected events.
