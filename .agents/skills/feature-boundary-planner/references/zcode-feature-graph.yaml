    to: service.automation
    type: commits-to
    rank: must-inspect
    condition:
      Trace onSubmit through AutomationsSection and the automation management store to the selected
      service; editing a field alone does not mutate a conversation.
  - from: service.automation
    to: persistence.automation-record
    type: persists-to
    rank: must-inspect
  - from: capability.subagents
    to: surface.user-subagent-form
    type: renders-in
    rank: must-inspect
  - from: capability.subagents
    to: surface.builtin-subagent-model
    type: renders-in
    rank: must-inspect
  - from: surface.user-subagent-form
    to: state.subagent-form-draft
    type: owns-draft
    rank: must-inspect
  - from: state.subagent-form-draft
    to: service.subagents
    type: commits-to
    rank: must-inspect
    condition: The form saves through createAgent or updateAgent.
  - from: surface.builtin-subagent-model
    to: service.subagents
    type: commits-to
    rank: must-inspect
    condition: Built-in and plugin overrides use setBuiltInModelOverride and setPluginAgentModelOverride.
  - from: service.subagents
    to: persistence.subagent-markdown
    type: persists-to
    rank: must-inspect
    condition:
      User/workspace definitions use Markdown; built-in/plugin overrides use the agent state
      file. Neither is a live conversation model switch.
  - from: capability.conversation-runtime
    to: service.conversation-command-inbox
    type: admits-commands-through
    rank: must-inspect
  - from: capability.conversation-runtime
    to: state.conversation-product-projection
    type: projects-runtime-events-through
    rank: must-inspect
  - from: capability.conversation-runtime
    to: state.work-segment-usage
    type: projects-runtime-events-through
