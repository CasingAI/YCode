<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YCode</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      #root {
        opacity: 0;
        transition: opacity 0.16s ease;
      }

      body.zcode-startup-ready #root {
        opacity: 1;
      }

      #loading {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.16s ease;
      }

      body.zcode-startup-ready #loading {
        pointer-events: none;
        opacity: 0;
      }

      /* 品牌动画阶段 1：表情轮播。JS 入口执行前只能承载这一段，
         帧序、单帧时长与周期必须与 packages/ui/src/root/startupBrandSequence.css 一致。
         品牌标识只用表情字形：窗口背景透明，深色方块叠在浅色系统材质上会被读成粗边框。*/
      .zcode-boot-brand {
        position: relative;
        width: 96px;
        height: 96px;
      }

      .zcode-boot-brand__face {
        position: absolute;
        top: 50%;
        left: 50%;
        font-size: 56px;
        line-height: 1;
        opacity: 0;
        transform: translate(-50%, -50%);
        animation: zcode-boot-brand-face 0.9s steps(1, end) infinite;
        /* 四帧共用同一条时间轴，逐帧递增延迟错开相位，循环处首尾相接不重叠。*/
        animation-delay: var(--zcode-boot-brand-phase, 0ms);
      }

      @keyframes zcode-boot-brand-face {
        0%,
        24.9% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
        25%,
        100% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.94);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        /* 无动画时退化为静态表情：首帧常显，表情外不加方块或底色。*/
        .zcode-boot-brand__face {
          display: none;
        }
        .zcode-boot-brand__face:first-of-type {
          display: block;
          opacity: 1;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div
      id="loading"
      class="[app-region:drag]"
      role="status"
      aria-busy="true"
      aria-label="Loading..."
    >
      <div class="zcode-boot-brand" aria-hidden="true">
        <span class="zcode-boot-brand__face" style="--zcode-boot-brand-phase: 0ms">😋</span>
        <span class="zcode-boot-brand__face" style="--zcode-boot-brand-phase: 225ms">😜</span>
        <span class="zcode-boot-brand__face" style="--zcode-boot-brand-phase: 450ms">🤪</span>
        <span class="zcode-boot-brand__face" style="--zcode-boot-brand-phase: 675ms">😋</span>
      </div>
    </div>
    <script type="module">
      const startupLoading = document.getElementById("loading");
      const isUpdateStatusWindow =
        new URLSearchParams(window.location.search).get("windowKind") === "update-status";
      let finished = false;
      let reactReady = false;

      // 主入口不能依赖动画结束后的动态 import；一旦导入路径在 Electron/Vite 下失败，
      // 页面会永久停在 HTML loading。这里让主入口静态加载，只把启动壳作为动画遮罩延迟移除。
      // 启动壳承载的是无限循环的表情轮播，没有动画结束事件，因此退场只等 React 首次 commit。
      const tryFinishStartup = () => {
        if (finished || !reactReady) return;
        finished = true;
        document.body.classList.add("zcode-startup-ready");
        window.setTimeout(() => startupLoading?.remove(), 500);
      };

      const markReactReady = () => {
        reactReady = true;
        tryFinishStartup();
      };

      if (isUpdateStatusWindow) {
        // 更新状态窗口本身就是一个轻量弹窗，复用主入口 HTML 时不应再显示启动壳。
        // 否则透明独立窗口里的启动画面会短暂或持续盖在更新按钮上，看起来像弹窗 UI 异常。
        finished = true;
        document.body.classList.add("zcode-startup-ready");
        startupLoading?.remove();
      } else {
        window.addEventListener("zcode-react-startup-ready", markReactReady, { once: true });
        window.setTimeout(markReactReady, 3000);
      }
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
